services:
  - type: web
    name: magicpin-assessment
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt && python dataset/generate_dataset.py --seed-dir dataset --out expanded"
    startCommand: "uvicorn bot:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /v1/healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 8080
